# Tidak dipakai untuk GEMMA449: deploy produksi memakai cPanel
# (lihat backend/deploy/cpanel/CPANEL-DEPLOY.md). Blueprint ini
# disimpan hanya sebagai alternatif; `plan: free` TIDAK mendukung
# disk 1GB sehingga tidak bisa dipakai apa adanya.
services:
  - type: web
    name: gemma449-api
    runtime: docker
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: GEMMA449
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/storage/app/sqlite/database.sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: public
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: TRUST_CF_CONNECTING_IP
        value: "true"
      - key: RUN_SEEDERS
        value: "true"
      - key: ADMIN_NAME
        value: Admin GEMMA449
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MIDTRANS_IS_PRODUCTION
        value: "false"
      - key: MIDTRANS_MERCHANT_ID
        sync: false
      - key: MIDTRANS_CLIENT_KEY
        sync: false
      - key: MIDTRANS_SERVER_KEY
        sync: false
    disk:
      name: sqlite-data
      mountPath: /var/www/html/storage/app/sqlite
      sizeGB: 1
